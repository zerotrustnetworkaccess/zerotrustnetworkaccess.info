{% assign no_bs = site.data.landing["ztna-no-bs"] %}
{% if no_bs.enable %}
<div
  class="container-fluid background-color ztna-landing-section-wrapper d-flex justify-content-center pb-50-30"
>
  <div class="ztna-content-wrapper mt-5">
    <p class="h5 light-text-2 text-center">{{no_bs.label}}</p>
    <div class="space10"></div>
    <h2 class="dark-text text-center ztna-margin-bottom-50-40">
      {{no_bs.title}}
    </h2>
    <div class="row mx-auto">
      {% for reason in no_bs.reasons %}
      <div class="col-lg-3 col-md-6 col-sm-6 text-center mb-0">
        <p
          class="light-blue-background-2 ztna-num-label white h2 ztna-margin-bottom-20-10"
        >
          {{forloop.index}}
        </p>
        <p class="h3 dark-text ztna-margin-bottom-50-40">{{reason}}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endif %}
