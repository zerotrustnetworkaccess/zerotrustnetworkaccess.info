<nav
  class="navbar navbar-hover-opacity navbar-expand-lg {% if include.extra_class %} {{include.extra_class}} {% endif %} "
>
  <div class="d-flex mx-auto justify-content-between ztna-nav">
  {% if include.dark_logo %}
  <a href="{{site.baseurl}}" class="ztna-dark-logo"></a>
  {% else %}
  <a href="{{site.baseurl}}" class="ztna-logo"></a>
  {% endif %}

  <div class="navbar-nav" data-sm-skip="true">
    <li class="nav-item">
      <div class="navbar-hamburger d-lg-none mr-20 mt-20">
        <button class="hamburger animate plain" data-toggle="offcanvas-nav">
          <span></span>
        </button>
      </div>
    </li>
  </div>

  <div class="navbar-collapse offcanvas-nav align-self-center justify-content-end mobile-bg">
    <div class="offcanvas-header d-lg-none">
      <button class="plain offcanvas-close offcanvas-nav-close icon-hover white">
        <i class="jam jam-close"></i>
      </button>
    </div>

    <ul class="navbar-nav menu align-items-lg-center align-items-start">
      {% for menu in site.data.navigation.main_menu %}
      <li class="ztna-nav-item mr-32 mb-md-50 {% if page.url == menu.url %} active {% endif %} {% if menu.text == 'Github' and include.hide_github %} ztna-hidden {% endif %}">
        <a class="nav-link d-flex align-items-center" href="{{menu.url}}" {% if menu.new_window %} target="_blank" {% endif %}>
          {% if menu.icon %}{% include icons/{{menu.icon}} cls="nav-link mobile-menu-items-fill" %}{% endif %}
          <span class="h4 {% if menu.icon %}ml-10{% endif %} text-link {% if include.dark_logo %} mobile-menu-items-color {% endif %}">{{menu.text}}</span>
        </a>
      </li>
      {% endfor %}
    </ul>
  </div>
</nav>
<!-- /.navbar -->
