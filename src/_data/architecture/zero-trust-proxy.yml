name: "Zero Trust Proxy"
abbreviation: ""
filter: "zero-trust-proxy"
display: true
sort_order: 3
image: "/assets/images/architecture/reverse-proxy.svg"

paragraphs: 
  - text: "Users and protected applications establish outbound connections to an access broker, which evaluates policy and mediates authorised sessions without exposing the private network."
  - text: "The broker may be vendor-operated or self-hosted. Depending on the product and protocol, it may terminate and proxy the session or relay traffic through an application-side connector."
  - text: "End-user access may be agentless. Vendors commonly also provide Cloud Access Security Broker (CASB) and Secure Web Gateway (SWG) functions complimentary to ZTNA."

strengths:
  - title: "No inbound firewall rules"
    description: ""
  - title: "Clientless access available"
    description: ""
  - title: "Protocol-aware"
    description: "Access to application traffic"
  - title: "Session recording and playback"
    description: "Products are often able to record and playback sessions for some protocols such as SSH, RDP and database traffic"
  - title: "Bundled security services"
    description: "Vendor may also offer Secure Web Gateway and Cloud Access Security Broker services"
  - title: "Application-scoped access"
    description: "Users can reach an authorised application without being placed directly onto its private network"
  - title: "Third-party and BYOD access"
    description: "Browser-based access can provide constrained access without installing a full network client"

weaknesses:
  - title: "Access depends on vendor uptime"
    description: "An outage in the proxy data plane, identity service or customer connector can interrupt application access"
  - title: "Limited protocol support"
    description: "Proxy based, so offers limited protocol support and so may not be able to replace VPN"
  - title: "East-West traffic"
    description: "Internal network traffic, originating inside the network perimeter and addressed to other private systems within the network. Often resembles server-to-server, machine-to-machine, inter-region connectivity or traffic inside a service mesh or service cluster. Can introduce latency and be expensive to move East-West traffic via the vendor's network"
  - title: "Application compatibility varies"
    description: "TLS pinning, mutual TLS, WebSockets, thick clients and custom protocols may not work through an inspecting proxy"
  - title: "Traffic backhaul adds latency and cost"
    description: "Backhauling traffic through vendor points of presence can add latency, bandwidth charges and geographic dependencies"
  - title: "Data residency and privacy constraints"
    description: "Traffic content and metadata may be processed in vendor infrastructure across multiple jurisdictions"

tradeoffs:
  - title: "Broker becomes a high-value target"
    description: "In order for endpoints to connect, the vendor must be publicly accessible"
  - title: "Internal traffic routed via vendor"
    description: ""
  - title: "Vendor terminates your TLS sessions"
    description: "Inspecting implementations terminate TLS and process plaintext; tunnel-based implementations may preserve end-to-end encryption"
  - title: "Vendor-controlled security policy"
    description: "Vendor may change or re-classify the security status of something which you weren't expecting or don't agree with"
  - title: "Inspection concentrates risk"
    description: "Central processing enables detailed policy, DLP and auditing while making the proxy a high-value security and availability dependency"
  - title: "Bundling increases vendor lock-in"
    description: "Combining ZTNA, SWG and CASB can reduce integration work while increasing dependence on one vendor's policy model and network"

