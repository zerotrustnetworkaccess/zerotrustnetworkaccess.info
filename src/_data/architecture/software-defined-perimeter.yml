name: "Software-Defined Perimeter"
abbreviation: "SDP"
filter: "software-defined-perimeter"
display: true
sort_order: 1
image: "/assets/images/architecture/sdp.svg"

paragraphs:
  - text: "Appliance and proxy-based architecture. A reverse proxy appliance (the SDP connector) is deployed at the network edge and governed by a centralised policy-based controller."
  - text: "Usually based on <a href=\"https://en.wikipedia.org/wiki/Port_knocking\">Single Packet Authorization</a> (SPA). Often agentless for the client (initiating host). May not require a separate SDP connector appliance if the SDP Connector software is deployed directly to the target system(s)."

strengths:
  - title: "Protected applications stay private"
    description: "Connectors commonly establish outbound-only connections, allowing inbound access to protected applications to remain closed"
  - title: "Application-scoped access"
    description: "Users can be granted access to a specific application without receiving general network or subnet reachability"
  - title: "North-South traffic"
    description: "Well suited to users connecting to private client-server applications across a network boundary"
  - title: "Protocol-aware"
    description: "Protocol-aware implementations can apply application-level policy and produce detailed audit records"
  - title: "Clientless access available"
    description: "Browser-based applications can often be accessed without a client agent; broader protocol support usually requires an agent or tunnel"

weaknesses:
  - title: "Connector deploys as VM or appliance"
    description: "Connector placement, application discovery, capacity planning and lifecycle management add operational work"
  - title: "Connector compromise expands exposure"
    description: "A connector may be able to reach several protected applications even when each user is authorised for only one"
  - title: "Protocol support varies"
    description: "Clientless proxies may not support UDP, peer-to-peer, VoIP, certificate-pinned applications or unusual protocols"
  - title: "East-West needs more connectors"
    description: "Workload-to-workload and multi-site connectivity may be cumbersome when enforcement is organised around application gateways"
  - title: "Pre-login access can be difficult"
    description: "User-centric authentication may not provide connectivity needed before login or by headless workloads"
  - title: "Network changes need reconfiguration"
    description: "Connector reachability, routes and application mappings must remain aligned with the underlying network"

tradeoffs:
  - title: "Broker becomes a high-value target"
    description: "Protected applications can remain private, but the public authentication and brokering service becomes a high-value target"
  - title: "Inspection versus end-to-end encryption"
    description: "Layer-7 inspection improves policy and audit detail but may require TLS termination and can affect mutual TLS or certificate pinning"
  - title: "HA requires redundant connectors"
    description: "Multiple connectors reduce the data-plane failure domain but increase cost and operational complexity"
  - title: "Incremental deployment"
    description: "SDP can be introduced application by application, although existing endpoint, application and network protections are still required"

