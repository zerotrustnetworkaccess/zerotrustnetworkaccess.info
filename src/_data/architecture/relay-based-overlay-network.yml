name: "Relay-Based Overlay Network"
abbreviation: ""
filter: "relay-based-overlay-network"
display: true
sort_order: 6
image: "/assets/images/architecture/idn.svg"

paragraphs: 
  - text: "Agent based architecture. All traffic traverses network relays coordinated by centralised policy-based management."
  - text: "Some vendors offer hardware devices to transparently connect devices to the network."

strengths:
  - title: "North-South traffic"
    description: "Traffic crossing the network perimeter, originating from outside the network, addressed to private systems within the network. Often resembles client-to-server connectivity"
  - title: "Universal protocol support"
    description: ""
  - title: "Incremental deployment"
    description: "" 
  - title: "No inbound firewall rules"
    description: "Most agent implementations establish outbound connections to relay servers, enabling administrators to deny inbound network traffic"
  - title: "Identity independent of IP address"
    description: "Policy can follow enrolled users, devices and workloads as their location or underlying network changes"
  - title: "NAT and overlapping network support"
    description: "Relays provide a common rendezvous path where direct routing or address-space coordination is impractical"
  - title: "Centralised traffic visibility"
    description: "Relay traversal can provide a consistent point for connection logging and policy enforcement"

weaknesses:
  - title: "Access depends on relay uptime"
    description: ""
  - title: "All network traffic traverses relays"
    description: "Protected traffic traversing relays can encounter concentrator bottlenecks; split-tunnel implementations relay only selected traffic"
  - title: "Appliances require patching"
    description: ""
  - title: "Agents require patching"
    description: ""
  - title: "Network changes need reconfiguration"
    description: ""
  - title: "East-West traffic"
    description: "Internal network traffic, originating inside the network perimeter and addressed to other private systems within the network. Often resembles server-to-server, machine-to-machine, inter-region connectivity or traffic inside a service mesh or service cluster. Achieved in this architecture by moving traffic through network relays, which can be inefficient"
  - title: "Relay placement affects residency"
    description: "Geography, jurisdiction and capacity of relay infrastructure influence performance, privacy and compliance"
  - title: "Relays expose traffic metadata"
    description: "Even where payloads remain end-to-end encrypted, relays can observe communicating identities, timing and traffic volume"
  - title: "Unmanaged devices have weaker identity"
    description: "Hardware gateways can connect legacy or IoT systems, but policy may identify the gateway or network rather than each individual device"
  - title: "Central relays enlarge failure domains"
    description: "Relay, DNS, identity or control-plane failures can disrupt every dependent connection in a region"

tradeoffs:
  - title: "Broker becomes a high-value target"
    description: "In order for endpoints to connect to it, the trust broker must be publicly accessible"
  - title: "HA requires redundant relays"
    description: "Some vendors allow deployment of multiple relays which can load balance traffic for greater resilience and availability"
  - title: "Central relays reduce path efficiency"
    description: "A consistent enforcement point simplifies audit and policy while adding latency, bandwidth cost and infrastructure dependence"
  - title: "Gateways dilute device identity"
    description: "Connecting unmanaged networks extends compatibility while weakening per-device authentication and containment"
  - title: "Inspection versus end-to-end encryption"
    description: "Relay inspection provides application context but requires access to plaintext; opaque forwarding preserves confidentiality with less policy detail"
  - title: "Split tunnelling mixes trust boundaries"
    description: "Relaying only protected applications saves bandwidth, although users and operators must understand which traffic is and is not governed"

