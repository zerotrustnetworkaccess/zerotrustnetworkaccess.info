name: "Mesh Overlay Network"
abbreviation: ""
filter: "mesh-overlay-network"
display: true
sort_order: 2
image: "/assets/images/architecture/mesh-overlay.svg"

paragraphs:
  - text: "Agent based architecture. Devices talk directly to one another coordinated by centralised policy-based management. Direct connections between cooperating systems are established using outbound-only traffic and a combination of device and user identity, UDP & TCP hole punching and NAT traversal techniques together create fast, end-to-end encrypted tunnels between connected systems from behind closed firewalls."
  - text: "Some NAT configurations prevent the direct connection establishment, in such cases traffic relays are used to ensure a connection can be made."

strengths:
  - title: "No inbound firewall rules"
    description: ""
  - title: "No gateway devices or proxy servers"
    description: ""
  - title: "Universal protocol support"
    description: ""
  - title: "Incremental deployment"
    description: ""
  - title: "North-South traffic"
    description: "Traffic crossing the network perimeter, originating from outside the network, addressed to private systems within the network. Often resembles client-to-server connectivity. This architecture is agnostic to system location, heterogeneous provider networks and logical network boundaries"
  - title: "East-West traffic"
    description: "Internal network traffic, originating inside the network perimeter and addressed to other private systems within the network. Often resembles server-to-server, machine-to-machine, inter-region connectivity or traffic inside a service mesh or service cluster. This architecture is agnostic to system location, heterogeneous provider networks and logical network boundaries"
  - title: "Removes complexity from the network"
    description: "Overlay networks are often formed using egress-only traffic, so administrators don't need to change the underlying network in order to arrange connectivity"
  - title: "Controller outage resilience"
    description: "Implementations that cache policy and keys at endpoints can preserve established connectivity during a temporary control-plane outage"
  - title: "No network changes to deploy"
    description: "Deploys on existing systems"
  - title: "Direct, end-to-end encrypted paths"
    description: "Peer-to-peer traffic can avoid central bottlenecks while preserving encryption between participating endpoints"
  - title: "Stable identity across changing networks"
    description: "Overlay identity can remain consistent as devices roam or their underlying IP addresses change"

weaknesses:
  - title: "Primarily agent-based deployment"
    description: ""
  - title: "Agents require patching"
    description: ""
  - title: "Peripheral traffic loses trust controls"
    description: "If the agent software is not installed, Zero Trust Network Access principles are lost as traffic leaves the overlay network"
  - title: "Limited application-layer visibility"
    description: "Network-layer overlays commonly have less application context than protocol-aware proxies"
  - title: "Endpoint compromise weakens enforcement"
    description: "Agents hold identity, keys and policy; a privileged attacker on an endpoint may tamper with or bypass local controls"
  - title: "NAT traversal can fail"
    description: "Restrictive firewalls and NAT configurations force relay fallback, changing expected latency, throughput and privacy"
  - title: "Unmanaged devices require a gateway"
    description: "Legacy, IoT and clientless systems normally need a subnet router or gateway, extending trust to traffic beyond an enrolled endpoint"
  - title: "Distributed policy is harder to debug"
    description: "Key rotation, revocation, service discovery and policy distribution become more complex as the mesh grows"

tradeoffs:
  - title: "Broker becomes a high-value target"
    description: "The broker may not carry traffic, but compromise can affect identity enrolment, policy distribution and key management"
  - title: "Direct paths reduce central inspection"
    description: "Peer-to-peer routing improves performance and privacy but provides fewer opportunities for central content inspection"
  - title: "Cached policy delays revocation"
    description: "Endpoints can continue during an outage, but access revocation may be delayed until they reconnect to the controller"
  - title: "Relay fallback adds cost and latency"
    description: "Relays improve connection success but add infrastructure cost, metadata exposure and a potential performance bottleneck"

